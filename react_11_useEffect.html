<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <!--react-->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <!--dom : 배포를 위해-->
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!--babel-->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/8.0.4/babel.min.js"></script>

  <!--user-->
  <script type="text/babel" defer>
    const rootElement = document.getElementById('root');

    //useEffect : 컴포넌트가 rendering이 될 때마다 특정 작업을 수행하도록 하는 훅
    //특정 작업은 매번, 초기 한번만, 특정 값이 변경될 때 실행

    const Info = () => {
      const [name, setName] = React.useState('');
      const [age, setAge] = React.useState('');

      React.useEffect(() => {
        console.log('랜더링 완료');
        console.log({
          name,
          age,
        });
      });
      //}) : 아무것도 안넣었을 땐 useEffect는 상태가 변경될 때마다 매번 랜더링이 수행됨
      //},[]) : 최초 한번만 랜더링 작업이 수행
      //}.[age]) : 특정값의 상태가 변경될 때 랜더링 작업이 수행

      const handleChangeName = (e) => setName(e.target.value);
      const handleChangeAge = (e) => setAge(e.target.value);

      return (
        <>
          <div>
            name : <input type='text' value={name} onChange={handleChangeName} /><br/>
            age : <input type='text' value={age} onChange={handleChangeAge} />
          </div>
          <h1>이름 : {name}</h1>
          <h2>나이 : {age}</h2>
        </>
      )
    }//Info_component

    ReactDOM.render(<Info />, rootElement);
  </script>
</head>

<body>
  <div id="root"></div>
</body>

</html>
