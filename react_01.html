    //React.createElement(component(태그를 가지고 만들어내는것), props(속성),...children(자식들));
    //1) React.createElement('component', {children});
    // const element = React.createElement('h1',{children: 'Hello!'});
  
    //2)React.createElement('component', props, 'children');
    // const element = React.createElement('h2',null,'React!');

    //3) React.createElement('component', props, ['children']);
    // const element = React.createElement('h3', null, ['Hello', 'React!']);
    
    /*

    /*

    const element02 = React.createElement('p',null,'Bye,JavaScript');

    ReactDOM.render(element02, rootElement);
    */
    /*rendering 시 최종 Dom 하나만 추가 (=> Fragment)*/

    //JSX (JavaScript XML) : 자바스크립트 확장 문법 / BABEL compiler(Transpiler)

    const rootElement = document.getElementById('root');

    // const element = <h1 className = 'title'>Hello,react!</h1>
    const text = 'Hello,react ~~~~';
    const userClassName = 'title';

    // const element = <h1 className = {userClassName}>{text}</h1>

    // const element = <h1 className = {userClassName} children = {text}></h1>
    //element 요소로 받는게 아닌 속성값으로 받기때문에 children으로 받아야함, 가장 많이 사용
    
    // const element = <h1 className = {userClassName} children = {text}/>
    //최종적인 모양

    const props = {
      className : userClassName,
      children : text
    }
    // const element = <h1 className = {props.className} children = {props.children}/>

    const element = <h1 {...props}/>
    //props 모든 데이터를 뿌린다

    ReactDOM.render(element,rootElement);
  </script>
  <style>
    /* .title {color: red;} */

<body>
  <div id="root"></div>
